name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seaspace
          POSTGRES_PASSWORD: seaspace
          POSTGRES_DB: seaspace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seaspace" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://seaspace:seaspace@localhost:5432/seaspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://seaspace:seaspace@localhost:5432/seaspace_test
        run: uv run alembic upgrade head && uv run alembic check

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
