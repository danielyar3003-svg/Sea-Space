[project]
name = "seaspace-api"
version = "0.1.0"
description = "SEA SPACE — Maritime Career Intelligence Platform API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
