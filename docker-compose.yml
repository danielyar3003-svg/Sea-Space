# Local stack: PostgreSQL + API. Run migrations with:
#   docker compose run --rm api /app/.venv/bin/alembic upgrade head
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seaspace
      POSTGRES_PASSWORD: seaspace
      POSTGRES_DB: seaspace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaspace"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://seaspace:seaspace@db:5432/seaspace
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
